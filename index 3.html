<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#140b14;color:#fbeff2;font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;max-width:380px;margin:0 auto}
.g-logo{font-size:56px;line-height:1}
.gate h1{font-size:30px;margin:0 0 6px;font-weight:800}
.gate input{font-size:16px;color:#fbeff2;background:#2e1c2b;border:1px solid #3f2a3b;border-radius:14px;padding:13px 15px;width:100%;outline:none;margin:5px 0}
.gate input:focus{border-color:#ff4d6d}
.g-btn{width:100%;min-height:52px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff6b6b,#d81b60);color:#fff;font-weight:700;font-size:17px;margin-top:8px;cursor:pointer}
.g-btn:disabled{opacity:.5}
.g-link{background:none;border:0;color:#c0a5b2;font-size:15px;margin-top:12px;cursor:pointer;text-decoration:underline}
.g-msg{color:#ffc145;font-size:14px;min-height:20px;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<div id="gate" class="gate">
 <div class="g-logo">&#128293;</div>
 <h1>Llama</h1>
 <div style="width:100%">
  <input id="g-email" type="email" inputmode="email" autocapitalize="off" autocomplete="username" placeholder="Correo">
  <input id="g-pass" type="password" autocomplete="current-password" placeholder="Contrase&#241;a">
  <div id="g-extra" style="display:none">
   <input id="g-name" placeholder="Tu nombre">
   <input id="g-code" autocapitalize="characters" placeholder="C&#243;digo de invitaci&#243;n">
  </div>
  <button id="g-go" class="g-btn">Entrar</button>
  <div style="text-align:center"><button id="g-toggle" class="g-link">Crear cuenta</button></div>
  <p id="g-msg" class="g-msg"></p>
 </div>
</div>
<div id="app"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var SB_URL="https://lytcpzbkvrdusxdsnmvv.supabase.co",SB_KEY="sb_publishable_A0OMN35DvVOla3Af7DOg9g_t96p5uFA";
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(id){return document.getElementById(id);};
var mode="login",booted=false;
function msg(t){$("g-msg").textContent=t||"";}
$("g-toggle").onclick=function(){mode=mode==="login"?"signup":"login";$("g-extra").style.display=mode==="signup"?"block":"none";$("g-go").textContent=mode==="signup"?"Crear cuenta":"Entrar";$("g-toggle").textContent=mode==="signup"?"Ya tengo cuenta":"Crear cuenta";msg("");};
$("g-go").onclick=go;
async function go(){
 var email=$("g-email").value.trim().toLowerCase(),pass=$("g-pass").value;
 if(!email||!pass){msg("Pon correo y contrase\u00f1a");return;}
 $("g-go").disabled=true;msg("Un momento\u2026");
 try{
  if(mode==="signup"){
   var name=$("g-name").value.trim(),code=$("g-code").value.trim();
   var r=await sb.functions.invoke("alta",{body:{email:email,password:pass,name:name,code:code}});
   var err=(r.data&&r.data.error)||(r.error&&r.error.message);
   if(err){msg(err);$("g-go").disabled=false;return;}
  }
  var si=await sb.auth.signInWithPassword({email:email,password:pass});
  if(si.error){msg("Correo o contrase\u00f1a incorrectos");$("g-go").disabled=false;return;}
  loadApp();
 }catch(e){msg("Error de conexi\u00f3n");$("g-go").disabled=false;}
}
async function loadApp(){
 if(booted)return;booted=true;
 try{
  var ses=(await sb.auth.getSession()).data.session;
  if(!ses){booted=false;return;}
  try{var fr=await sb.from("config").select("v").eq("k","firma").maybeSingle();if(fr.data&&fr.data.v)window.LLAMA_FIRMA=fr.data.v;}catch(e){}
  window.sb=sb;
  window.SHELL={user:ses.user,url:SB_URL,logout:async function(){await sb.auth.signOut();location.reload();}};
  $("gate").style.display="none";
  var lk=document.createElement("link");lk.rel="stylesheet";lk.href="app.css";document.head.appendChild(lk);
  var sc=document.createElement("script");sc.src="app.js";sc.onerror=function(){$("app").textContent="No he podido cargar la app. Reintenta.";};document.head.appendChild(sc);
  if("serviceWorker" in navigator){try{await navigator.serviceWorker.register("sw.js");}catch(e){}}
 }catch(e){msg("No he podido abrir: "+(e.message||e));booted=false;}
}
sb.auth.getSession().then(function(x){if(x.data.session)loadApp();});
})();
</script>
</body>
</html>
