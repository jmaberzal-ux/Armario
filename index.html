<!doctype html>
<html lang="es" data-tema="claro" data-letra="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="365">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>365</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* 365 · estilos. Lectura cómoda: sin serifa, 18 px, interlineado 1,5, fondo crema, sin cursivas. */
:root {
  --bg: #f6f1e7;
  --card: #fffdf8;
  --card-2: #f1ebdf;
  --text: #2a2723;
  --muted: #6b645a;
  --line: #e4dccd;
  --accent: #3d6b59;
  --accent-soft: #e3ece6;
  --accent-text: #ffffff;
  --warn: #a8642a;
  --warn-soft: #f6e8d9;
  --danger: #a3433a;
  --ok: #3d6b59;
  --shadow: 0 1px 2px rgba(60, 50, 30, .06), 0 4px 14px rgba(60, 50, 30, .05);
  --radius: 18px;
  --fs: 18px;
  --tab-h: 64px;
  --a-mente: #e4ebee; --a-meditacion: #e6e9f2; --a-diario: #efe8dc; --a-redes: #ece6ef;
  --a-ejercicio: #e3eee2; --a-familia: #f3e8de; --a-orden: #e9e9e1; --a-finanzas: #e6eee9;
  --a-lectura: #f1eadb; --a-pareja: #f2e4e4; --a-alimentacion: #eaefdf;
  color-scheme: light;
}
html[data-tema="oscuro"] {
  --bg: #1c1a17; --card: #26231f; --card-2: #2e2a25; --text: #ece6da; --muted: #a59d90;
  --line: #3a352e; --accent: #8cc2ab; --accent-soft: #2c3a33; --accent-text: #13201a;
  --warn: #e0a56b; --warn-soft: #3a2f24; --danger: #e08a80; --ok: #8cc2ab;
  --shadow: none;
  --a-mente: #262d30; --a-meditacion: #272a33; --a-diario: #302b23; --a-redes: #2d2830;
  --a-ejercicio: #252e25; --a-familia: #322a23; --a-orden: #2b2b26; --a-finanzas: #25302a;
  --a-lectura: #312c22; --a-pareja: #332626; --a-alimentacion: #2b3024;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  html[data-tema="auto"] {
    --bg: #1c1a17; --card: #26231f; --card-2: #2e2a25; --text: #ece6da; --muted: #a59d90;
    --line: #3a352e; --accent: #8cc2ab; --accent-soft: #2c3a33; --accent-text: #13201a;
    --warn: #e0a56b; --warn-soft: #3a2f24; --danger: #e08a80; --ok: #8cc2ab;
    --shadow: none;
    --a-mente: #262d30; --a-meditacion: #272a33; --a-diario: #302b23; --a-redes: #2d2830;
    --a-ejercicio: #252e25; --a-familia: #322a23; --a-orden: #2b2b26; --a-finanzas: #25302a;
    --a-lectura: #312c22; --a-pareja: #332626; --a-alimentacion: #2b3024;
    color-scheme: dark;
  }
}
html[data-letra="grande"] { --fs: 20px; }
html[data-letra="muy-grande"] { --fs: 22px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: var(--fs); line-height: 1.5; letter-spacing: .01em; font-style: normal;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
  min-height: 100vh;
}
body.sin-tabs { padding-bottom: env(safe-area-inset-bottom); }
em, i { font-style: normal; font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 650; }
h1 { font-size: 1.55em; }
h2 { font-size: 1.15em; }
h3 { font-size: 1em; }
p { margin: 0; }

#app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 8px; }
.pantalla { display: flex; flex-direction: column; gap: 14px; }
.cabecera { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 2px; }
.cabecera .sub { color: var(--muted); }
.frase { color: var(--muted); font-size: .95em; padding: 0 2px; }

.tarjeta { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.tarjeta.suave { background: var(--card-2); box-shadow: none; }
.tarjeta.destacada { border-color: var(--accent); }
.tarjeta.aviso { background: var(--warn-soft); border-color: transparent; }
.tarjeta h2 + p, .tarjeta h3 + p { margin-top: 4px; }
.etiqueta { font-size: .78em; color: var(--muted); text-transform: none; letter-spacing: .02em; font-weight: 600; }
.muted { color: var(--muted); }
.pequeno { font-size: .85em; }
.fila { display: flex; align-items: center; gap: 10px; }
.fila.entre { justify-content: space-between; }
.fila.arriba { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.envolver { flex-wrap: wrap; }
.crece { flex: 1; min-width: 0; }
.separador { height: 1px; background: var(--line); margin: 6px 0; }

.boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 600; text-decoration: none; color: var(--text); }
.boton.principal { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.boton.suave { background: var(--accent-soft); border-color: transparent; color: var(--text); }
.boton.aviso { background: var(--warn); color: #fff; border-color: var(--warn); }
.boton.peligro { color: var(--danger); }
.boton.ancho { width: 100%; }
.boton.peq { min-height: 40px; padding: 8px 12px; font-size: .9em; border-radius: 12px; }
.boton:disabled { opacity: .5; }
.botones { display: flex; gap: 10px; flex-wrap: wrap; }
.botones > .boton { flex: 1 1 auto; }
.enlace { background: none; border: none; color: var(--accent); padding: 8px 0; font-weight: 600; text-align: left; }

/* Lo siguiente */
.siguiente { display: flex; flex-direction: column; gap: 12px; }
.siguiente .titulo { font-size: 1.3em; font-weight: 650; line-height: 1.25; }

/* Hábitos de hoy */
.lista { display: flex; flex-direction: column; }
.habito { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.habito:last-child { border-bottom: none; }
.habito .info { flex: 1; min-width: 0; }
.habito .nombre { font-weight: 600; }
.habito .detalle { color: var(--muted); font-size: .85em; }
.habito.hecho .nombre { color: var(--muted); }
.check { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }
.check svg { width: 24px; height: 24px; }
.check.hecho { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.check.minimo { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.check.no { background: var(--card-2); border-color: var(--line); color: var(--muted); }
.mas { width: 40px; height: 40px; border-radius: 12px; border: none; background: transparent; color: var(--muted); font-size: 1.4em; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: .88em; min-height: 40px; }
.chip.activo { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.insignia { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); font-size: .75em; font-weight: 600; }

.progreso { height: 8px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.progreso > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }

.acciones-rapidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.acciones-rapidas .boton { flex-direction: column; gap: 4px; min-height: 76px; font-size: .9em; }
.acciones-rapidas .boton svg { width: 24px; height: 24px; }
.ganas-grande { min-height: 64px; font-size: 1.05em; }

/* Formularios */
label.campo { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .92em; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=time], input[type=tel], textarea, select {
  width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: max(16px, 1em); font-weight: 400;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
textarea.grande { min-height: 220px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dias-semana button { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 650; }
.dias-semana button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; font-weight: 600; font-size: .92em; }
.interruptor input { width: 28px; height: 28px; accent-color: var(--accent); }
.intensidad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.intensidad button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 650; font-size: 1.05em; }
.intensidad button.on { background: var(--warn); color: #fff; border-color: var(--warn); }

/* Barra de pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tab-h); color: var(--muted); text-decoration: none; font-size: 12.5px; font-weight: 600; letter-spacing: 0; }
.tabs a svg { width: 26px; height: 26px; }
.tabs a.activa { color: var(--accent); text-decoration: none; }
body.sin-tabs .tabs { display: none; }

/* Hoja inferior */
.velo { position: fixed; inset: 0; background: rgba(20, 16, 10, .38); z-index: 40; opacity: 0; transition: opacity .2s ease; }
.velo.visible { opacity: 1; }
.hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; max-width: 640px; margin: 0 auto; }
.hoja.visible { transform: translateY(0); }
.hoja .asa { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 12px; }
.hoja .cuerpo { display: flex; flex-direction: column; gap: 14px; }

/* Aviso flotante */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px); transform: translateX(-50%) translateY(20px); z-index: 60; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 32px); opacity: 0; transition: all .2s ease; font-size: .92em; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast button { background: none; border: none; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 6px; }

/* Temporizador */
.temporizador { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px); text-align: center; }
.temporizador .tiempo { font-size: 4em; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.respiracion { width: 180px; height: 180px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; animation: respirar 10s ease-in-out infinite; color: var(--muted); font-size: .9em; }
@keyframes respirar { 0%, 100% { transform: scale(.72); } 40% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .respiracion { animation: none; } .hoja, .toast, .velo { transition: none; } }
.temporizador .botones { width: 100%; max-width: 420px; }

/* Calendarios y gráficos */
.mapa-anual { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 6px; }
.mapa-anual span { width: 12px; height: 12px; border-radius: 3px; background: var(--card-2); }
.mapa-anual span.n1 { background: color-mix(in srgb, var(--accent) 30%, var(--card-2)); }
.mapa-anual span.n2 { background: color-mix(in srgb, var(--accent) 55%, var(--card-2)); }
.mapa-anual span.n3 { background: color-mix(in srgb, var(--accent) 80%, var(--card-2)); }
.mapa-anual span.n4 { background: var(--accent); }
.mapa-anual span.fuera { background: transparent; }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
.barras .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.barras .b span { width: 100%; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.barras .b.aviso span { background: var(--warn); }
.barras .b small { color: var(--muted); font-size: 11px; }
.rejilla-ganas { display: grid; grid-template-columns: auto repeat(7, 1fr); gap: 4px; font-size: 12px; align-items: center; }
.rejilla-ganas .c { height: 26px; border-radius: 6px; background: var(--card-2); }
.rejilla-ganas .c.n1 { background: color-mix(in srgb, var(--warn) 30%, var(--card-2)); }
.rejilla-ganas .c.n2 { background: color-mix(in srgb, var(--warn) 60%, var(--card-2)); }
.rejilla-ganas .c.n3 { background: var(--warn); }
.rejilla-ganas b { text-align: center; color: var(--muted); font-weight: 600; }

/* Mi espacio */
.modulos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modulo { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--text); min-height: 104px; }
.modulo svg { width: 26px; height: 26px; color: var(--accent); }
.modulo b { font-weight: 650; }
.modulo small { color: var(--muted); font-size: .8em; }

.entrada { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.entrada .fecha { color: var(--muted); font-size: .82em; font-weight: 600; }
.entrada .texto { white-space: pre-wrap; margin-top: 4px; }
.codigo { font-family: ui-monospace, Menlo, monospace; font-size: 1.1em; letter-spacing: .06em; background: var(--card-2); padding: 12px; border-radius: 12px; text-align: center; word-break: break-all; }
.oculto { display: none !important; }
.centro { text-align: center; }
.logo { font-size: 3.2em; font-weight: 700; letter-spacing: -.02em; color: var(--accent); }
.estado-sync { color: var(--muted); font-size: .78em; text-align: center; padding: 6px 0 2px; }
.segmentos { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--card-2); padding: 4px; border-radius: 14px; }
.segmentos button { min-height: 44px; border: none; border-radius: 11px; background: transparent; font-weight: 600; color: var(--muted); }
.segmentos button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

/* ---------- Añadidos fase 1 ---------- */
svg { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.2em; }
.boton svg { width: 22px; height: 22px; }
.icono-medio { display: inline-flex; }
.icono-medio svg { width: 26px; height: 26px; }
.tabs a span { line-height: 1; }
body.con-hoja, body.con-capa { overflow: hidden; }
.oculto-accesible { position: absolute !important; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; border: 0; padding: 0; margin: -1px; }
.error { color: var(--danger); font-weight: 600; min-height: 0; }
.error:empty { display: none; }
a.tarjeta, a.habito, a.modulo { color: inherit; text-decoration: none; }
a.tarjeta { display: flex; }
a.habito .nombre { color: var(--text); }
.portada { align-items: center; padding: 8vh 0 2vh; }
.pregunta { font-size: 1.35em; }
.pregunta-corta { color: var(--muted); font-size: .85em; font-weight: 650; margin-top: 8px; }
.escribir textarea.grande { min-height: 38vh; }
input[type=search] { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: max(16px, 1em); -webkit-appearance: none; appearance: none; }
.hora-corta { width: auto !important; min-height: 44px !important; padding: 8px 10px !important; }
.sub-bloque { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sub-bloque:last-child { border-bottom: none; padding-bottom: 0; }
details > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.intensidad.seis { grid-template-columns: repeat(6, 1fr); }
.modulo.off { opacity: .55; }
.razon { font-size: 1.15em; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fila-boton { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 2px; border: none; border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--text); }
.fila-boton:last-child { border-bottom: none; }
.texto-boton { background: none; border: none; padding: 0; text-align: left; color: var(--text); }
.tarjeta .entrada { background: var(--card-2); border: none; }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--card-2); }
.leyenda i.h, .leyenda i.n4 { background: var(--accent); }
.leyenda i.m, .leyenda i.n2 { background: color-mix(in srgb, var(--accent) 45%, var(--card-2)); }
.leyenda i.x { background: var(--card-2); border: 1.5px solid var(--muted); }
.leyenda i.p { background: var(--card-2); border: 1.5px dashed var(--line); }
.cal-habito { display: grid; grid-template-columns: repeat(8, 1fr) auto; grid-template-rows: repeat(7, 1fr); gap: 4px; align-items: center; }
.cal-habito span { height: 18px; border-radius: 4px; }
.cal-habito span.h { background: var(--accent); }
.cal-habito span.m { background: color-mix(in srgb, var(--accent) 45%, var(--card-2)); }
.cal-habito span.x { background: var(--card-2); border: 1.5px solid var(--muted); }
.cal-habito span.p { background: var(--card-2); border: 1.5px dashed var(--line); }
.cal-habito span.f { background: transparent; }
.cal-habito b { font-size: 11px; color: var(--muted); font-weight: 600; padding-left: 4px; }
.cal-mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-mes b { font-size: 12px; color: var(--muted); font-weight: 600; }
.cal-mes button { min-height: 38px; border-radius: 10px; border: none; background: transparent; color: var(--muted); font-size: .9em; }
.cal-mes button.con { background: var(--accent-soft); color: var(--text); font-weight: 650; }
.cal-mes button.sel { background: var(--accent); color: var(--accent-text); }
.cal-mes button:disabled { opacity: .45; }
.mapa-anual span.n0 { background: var(--card-2); }
.temporizador h1 { font-size: 1.6em; }
.mapa-anual span.futuro { background: var(--card-2); opacity: .45; }
ol.pasos { margin: 0; padding-left: 1.5em; display: flex; flex-direction: column; gap: 12px; }
ol.pasos li { padding-left: 4px; }
ol.pasos li::marker { font-weight: 700; color: var(--accent); }
.habito .check b { font-size: .95em; color: var(--muted); }
.error a { color: var(--accent); }
.progreso.pasado > span { background: var(--warn); }
/* Categorías de gasto */
.rejilla-cat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 72px; padding: 8px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .8em; line-height: 1.15; text-align: center; }

        await salir();
        mostrarEntrada();
      }
    };
  }
  async function continuar() {
    if (!perfil()) {
      document.body.classList.add("sin-tabs");
      el.innerHTML = '<div class="pantalla centro portada"><div class="logo">365</div><p class="muted">Preparando tus datos…</p></div>';
      await sincronizar();
      if (!perfil()) {
        pantallaSinPerfil();
        return;
      }
    }
    if (!hayCifrado()) {
      pintarFrase(el, iniciar);
      return;
    }
    iniciar();
  }
  function registrarSW() {
    if (MODO_PRUEBA || !("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:") return;
    navigator.serviceWorker.register("./sw.js").catch(() => {
    });
  }
  async function arrancar() {
    await abrir();
    cargarSesion();
    alCaducar(() => mostrarEntrada("Tu sesión ha caducado. Vuelve a entrar; lo guardado en el móvil se conserva."));
    registrarSW();
    if (!haySesion()) {
      mostrarEntrada();
      return;
    }
    await continuar();
  }
  arrancar().catch((e) => {
    console.error(e);
    el.innerHTML = `<div class="pantalla"><h1>No se pudo abrir</h1><p class="muted">${String(e && e.message)}</p><button class="boton" onclick="location.reload()">Reintentar</button></div>`;
  });
})();

</script>
</body>
</html>
